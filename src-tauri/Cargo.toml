[package]
name = "labnexus"
version = "0.4.0"
description = "LabNexus — Remote JupyterLab Client with AI Agent"
authors = ["wangliangxu"]
edition = "2021"

[lib]
name = "labnexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client (with SOCKS5 proxy support for SSH -D tunnels)
reqwest = { version = "0.12", features = ["json", "socks"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket (Jupyter Kernel communication)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# TLS (for WebSocket over SOCKS5 proxy — tokio-tungstenite re-exports these but we need direct access)
native-tls = "0.2"
tokio-native-tls = "0.3"

# SOCKS5 proxy support
tokio-socks = "0.5"

# Database (local SQLite for config, sessions, knowledge base)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# UUID (Jupyter message IDs)
uuid = { version = "1", features = ["v4"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# URL parsing
url = { version = "2", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"
